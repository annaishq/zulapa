# Deploy the docs site (`docs/dist`) to GitHub Pages. The build checks every
# rule against the frozen engine in `packages/legacy`.

name: Deploy GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Build the docs
        run: pnpm run docs

      - uses: actions/upload-pages-artifact@v4
        with:
          path: docs/dist

      - id: deploy
        uses: actions/deploy-pages@v4
